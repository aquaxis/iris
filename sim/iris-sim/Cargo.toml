[package]
name = "iris-sim"
version = "0.1.0"
edition = "2021"
description = "IRIS RTL Simulator - A simulator for IRIS hardware description language"
license = "MIT"

[dependencies]
pest = "=2.7.10"
pest_derive = "=2.7.10"
clap = { version = "=4.4.18", features = ["derive"] }
thiserror = "=1.0.50"
anyhow = "=1.0.75"
fst-sys = "=0.2.0"

[[bin]]
name = "iris-sim"
path = "src/main.rs"

[lib]
name = "iris_sim"
path = "src/lib.rs"

[dev-dependencies]
