[package]
name = "irisfmt-lsp"
version = "0.1.0"
edition = "2021"
description = "IRIS language server (Rust port of the TypeScript irisfmt-ls)"
publish = false

[dependencies]
irisfmt = { path = "../irisfmt-rs" }
iris-sim = { path = "../../sim/iris-sim" }
lsp-types = "0.95"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "irisfmt-lsp"
path = "src/main.rs"

[workspace]
