[package]
name = "iris"
version = "0.1.0"
edition = "2021"
description = "Unified command line for the IRIS tools"

# No dependencies on purpose. `iris-sim` pins clap 4.4.18 while `veryl-parser`
# needs clap ^4.6, so the two cannot share a lock; linking either here would
# pull that conflict in. `iris` dispatches to the built binaries instead, so it
# stays free of it and builds offline.

[[bin]]
name = "iris"
path = "src/main.rs"
